<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cửa Hàng Tiện Ích</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #0a0e17; color: #c9d1d9; min-height: 100vh; padding: 20px 16px; display: block; }
        .shop-container { width: 100%; max-width: 900px; margin: 0 auto; }
        
        /* Header */
        .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .logo-icon { width: 36px; height: 36px; background: #1f2937; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #00ff88; font-size: 1.2rem; font-weight: bold; }
        .brand-info p { font-size: 0.85rem; color: #3b82f6; font-weight: bold; }
        .product-count-badge { background: #1e3a5f; color: #60a5fa; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .header-right { display: flex; align-items: center; gap: 12px; }
        .cart-btn { background: #1f2937; color: #ffffff; border: 1px solid #30363d; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .cart-btn:hover { background: #374151; }
        .cart-count { background: #2563eb; color: white; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: bold; }
        
        /* Sub Header */
        .sub-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding: 0 4px; }
        .sub-header-left { display: flex; align-items: center; gap: 12px; }
        .category-select { background: #131a26; color: #c9d1d9; border: 1px solid #30363d; padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; outline: none; cursor: pointer; }
        .collapse-btn { background: #131a26; color: #c9d1d9; border: 1px solid #30363d; padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 4px; }
        
        /* Grid */
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; justify-content: center; }
        @media (min-width: 768px) { .product-grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; } }
        
        /* Card */
        .product-card { background: #131a26; border-radius: 16px; border: 1px solid #21262d; overflow: hidden; display: flex; flex-direction: column; width: 100%; }
        .card-image { background: #0d1117; padding: 20px 10px; display: flex; justify-content: center; align-items: center; position: relative; min-height: 120px; }
        .badge { position: absolute; top: 10px; left: 10px; background: #78350f; color: #fbbf24; font-size: 0.55rem; font-weight: bold; padding: 3px 6px; border-radius: 4px; text-transform: uppercase; }
        .freefire-icon { width: 60px; height: 60px; background: #ff6b00; background: linear-gradient(135deg, #ff6b00, #ff0055); border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 2rem; box-shadow: 0 0 20px rgba(255, 107, 0, 0.4); transform: rotate(-5deg); }
        .card-content { padding: 12px; display: flex; flex-direction: column; flex: 1; }
        .card-category { color: #3b82f6; font-size: 0.65rem; font-weight: bold; text-transform: uppercase; margin-bottom: 4px; }
        .card-title { color: #ffffff; font-size: 0.85rem; font-weight: bold; margin-bottom: 8px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-meta { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
        .card-meta span { color: #8b949e; font-size: 0.7rem; }
        .card-bottom { margin-top: auto; }
        .card-price { color: #00ff88; font-size: 0.9rem; font-weight: bold; margin-bottom: 4px; }
        .card-stock { color: #8b949e; font-size: 0.7rem; margin-bottom: 10px; }
        .card-btn { width: 100%; padding: 8px; background: #1f2937; color: #e5e7eb; border: 1px solid #374151; border-radius: 8px; font-weight: bold; font-size: 0.75rem; cursor: pointer; text-align: center; text-decoration: none; display: block; }
        .card-btn:hover { background: #374151; color: #ffffff; }
        .card-btn.download { background: #2563eb; color: white; border-color: #2563eb; }
        .card-btn.download:hover { background: #1d4ed8; }
        
        /* Cart */
        .cart-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.7); display: none; justify-content: flex-end; z-index: 1000; }
        .cart-overlay.open { display: flex; }
        .cart-panel { background: #131a26; width: 100%; max-width: 400px; height: 100%; padding: 24px; display: flex; flex-direction: column; overflow-y: auto; border-left: 1px solid #21262d; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .cart-header h2 { font-size: 1.2rem; color: #ffffff; }
        .close-btn { background: none; border: none; color: #8b949e; font-size: 1.8rem; cursor: pointer; line-height: 1; }
        .close-btn:hover { color: #ffffff; }
        .cart-items { flex: 1; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #21262d; }
        .cart-item-info { display: flex; flex-direction: column; gap: 4px; }
        .cart-item-name { font-weight: bold; color: #ffffff; font-size: 0.9rem; }
        .cart-item-price { color: #8b949e; font-size: 0.8rem; }
        .cart-item-qty { display: flex; align-items: center; gap: 8px; }
        .qty-btn { width: 28px; height: 28px; border: 1px solid #30363d; background: #1f2937; color: #c9d1d9; border-radius: 6px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        .qty-btn:hover { background: #374151; }
        .remove-btn { background: none; border: none; color: #f87171; cursor: pointer; font-size: 1.1rem; margin-left: 4px; }
        .cart-total { display: flex; justify-content: space-between; font-size: 1.1rem; font-weight: bold; padding: 16px 0; border-top: 2px solid #21262d; margin-top: 12px; color: #ffffff; }
        .checkout-btn { background: #2563eb; color: white; border: none; padding: 14px; border-radius: 10px; font-weight: bold; font-size: 1rem; cursor: pointer; }
        .checkout-btn:hover { background: #1d4ed8; }
        .empty-cart { text-align: center; color: #8b949e; padding: 40px 0; font-size: 0.9rem; }
        
        /* Support Widget */
        .support-widget { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; z-index: 9999; }
        .support-options { display: flex; flex-direction: column; gap: 10px; opacity: 0; visibility: hidden; transform: translateY(10px); transition: all 0.3s ease; }
        .support-options.show { opacity: 1; visibility: visible; transform: translateY(0); }
        .support-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; border-radius: 25px; text-decoration: none; color: white; font-weight: bold; font-size: 0.85rem; box-shadow: 0 4px 15px rgba(0,0,0,0.4); transition: transform 0.2s, background 0.2s; min-width: 120px; }
        .support-btn:hover { transform: scale(1.05); }
        .zalo-btn { background: #0068FF; }
        .zalo-btn:hover { background: #0055cc; }
        .support-toggle { width: 55px; height: 55px; border-radius: 50%; background: #2563eb; color: white; border: none; font-size: 1.6rem; cursor: pointer; box-shadow: 0 4px 20px rgba(37, 99, 235, 0.5); display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; }
        .support-toggle:hover { background: #1d4ed8; transform: scale(1.1); }
        .support-toggle.active { transform: rotate(45deg); background: #1e40af; }
    </style>
</head>
<body>

    <div id="shopSection" class="shop-container">
        <div class="top-header">
            <div class="header-left">
                <div class="logo-icon">⬡</div>
                <div class="brand-info"><p>Cửa hàng tiện ích</p></div>
                <span class="product-count-badge" id="productCountBadge">0 sản phẩm</span>
            </div>
            <div class="header-right">
                <button class="cart-btn" id="openCart">🛍️ <span class="cart-count" id="cartCount">0</span></button>
            </div>
        </div>

        <div class="sub-header">
            <div class="sub-header-left">
                <select class="category-select" id="categoryFilter">
                    <option value="all">Tất cả</option>
                    <option value="GAME">GAME</option>
                    <option value="AIMLOCK">AIMLOCK</option>
                    <option value="DPI">DPI</option>
                    <option value="TỐI ƯU">TỐI ƯU</option>
                    <option value="IOS">IOS</option>
                </select>
            </div>
            <button class="collapse-btn">Thu gọn ▸</button>
        </div>

        <main><div class="product-grid" id="productGrid"></div></main>

        <div class="cart-overlay" id="cartOverlay">
            <div class="cart-panel">
                <div class="cart-header">
                    <h2>Giỏ hàng</h2>
                    <button class="close-btn" id="closeCart">&times;</button>
                </div>
                <div class="cart-items" id="cartItems"></div>
                <div class="cart-total"><span>Tổng cộng:</span><span id="cartTotal">0 ₫</span></div>
                <button class="checkout-btn" id="checkoutBtn">Thanh toán</button>
            </div>
        </div>
    </div>

    <div class="support-widget">
        <div class="support-options" id="supportOptions">
            <a href="https://zalo.me/0907415055" target="_blank" class="support-btn zalo-btn"><span>💬</span> Zalo</a>
        </div>
        <button class="support-toggle" id="supportToggle">💬</button>
    </div>

    <script>
        // ==================== DỮ LIỆU ====================
        var products = [
            { id: 1, category: 'GAME', name: 'Định vị moco', duration: 'VĨNH VIỄN', sold: 99, price: 0, stock: 999, badge: 'HOT', img: 'freefire', downloadLink: 'https://www.mediafire.com/file/rbh9kfdmzz9wnh4/Dragon_Injector_V2.apk/file', downloadText: 'Tải APK' },
            { id: 2, category: 'TỐI ƯU', name: 'File tối ưu giảm lag ADR', duration: 'MỚI NHẤT', sold: 150, price: 0, stock: 999, badge: 'HOT', img: 'file', downloadLink: 'https://link4m.com/4mZKZR', downloadText: 'Tải Xuống' },
            { id: 3, category: 'TỐI ƯU', name: 'File nhạy cho ADR máy yếu', duration: 'MỚI NHẤT', sold: 89, price: 0, stock: 999, badge: '', img: 'file', downloadLink: 'https://link4m.com/t35Dtr', downloadText: 'Tải Xuống' },
            { id: 4, category: 'TRỢ NĂNG', name: 'File trợ năng SS', duration: 'MỚI NHẤT', sold: 200, price: 0, stock: 999, badge: 'HOT', img: 'file', downloadLink: 'https://link4m.com/vTCRA', downloadText: 'Tải Xuống' },
            { id: 5, category: 'REDMI', name: 'File Redmi', duration: 'MỚI NHẤT', sold: 45, price: 0, stock: 999, badge: '', img: 'file', downloadLink: 'https://link4m.com/vOhZitQA', downloadText: 'Tải Xuống' },
            { id: 6, category: 'OPPO', name: 'File Oppo', duration: 'MỚI NHẤT', sold: 60, price: 0, stock: 999, badge: '', img: 'file', downloadLink: 'https://link4m.com/32HsAJ', downloadText: 'Tải Xuống' },
            { id: 7, category: 'NHẠY', name: 'File nhạy ngày', duration: 'MỚI NHẤT', sold: 120, price: 0, stock: 999, badge: 'HOT', img: 'file', downloadLink: 'https://link4m.com/HCiWS62T', downloadText: 'Tải Xuống' },
            { id: 8, category: 'AIMLOCK', name: 'File Aimlock 💝', duration: 'MỚI NHẤT', sold: 300, price: 0, stock: 999, badge: 'HOT', img: 'aim', downloadLink: 'https://link4m.com/V6Jii8', downloadText: 'Tải Xuống' },
            { id: 9, category: 'DPI', name: 'DPI Oppo ngày', duration: 'MỚI NHẤT', sold: 70, price: 0, stock: 999, badge: '', img: 'file', downloadLink: 'https://link4m.com/A5YS6yK', downloadText: 'Tải Xuống' },
            { id: 11, category: 'AIMLOCK', name: 'Aimlock Mode IOS&ADR', duration: 'MỚI NHẤT', sold: 210, price: 0, stock: 999, badge: 'HOT', img: 'aim', downloadLink: 'https://link4m.com/qLFbt', downloadText: 'Tải Xuống' },
            { id: 12, category: 'AIMLOCK', name: 'Aimlock Venia', duration: 'MỚI NHẤT', sold: 95, price: 0, stock: 999, badge: '', img: 'aim', downloadLink: 'https://link4m.com/QbY7AjW6', downloadText: 'Tải Xuống' },
            { id: 13, category: 'AIMLOCK', name: 'Aimlock Musy', duration: 'MỚI NHẤT', sold: 110, price: 0, stock: 999, badge: 'MỚI', img: 'aim', downloadLink: 'https://link4m.com/S0E57', downloadText: 'Tải Xuống' },
            { id: 14, category: 'KODER', name: 'Koder Pro', duration: 'MỚI NHẤT', sold: 40, price: 0, stock: 999, badge: '', img: 'file', downloadLink: 'https://link4m.com/cvV1E', downloadText: 'Tải Xuống' },
            { id: 15, category: 'AIMLOCK', name: 'File Aimlock 4/3', duration: '04/03', sold: 85, price: 0, stock: 999, badge: '', img: 'aim', downloadLink: 'https://link4m.com/FS3xL5l', downloadText: 'Tải Xuống' },
            { id: 16, category: 'AIMLOCK', name: 'Aimlock v2', duration: 'MỚI NHẤT', sold: 130, price: 0, stock: 999, badge: '', img: 'aim', downloadLink: 'https://link4m.com/CKNQD', downloadText: 'Tải Xuống' },
            { id: 17, category: 'AIMLOCK', name: 'Aimlock Bin', duration: 'MỚI NHẤT', sold: 55, price: 0, stock: 999, badge: '', img: 'aim', downloadLink: 'https://link4m.com/zoeczLvi', downloadText: 'Tải Xuống' },
            { id: 18, category: 'IOS', name: 'Aimlock IOS', duration: 'MỚI NHẤT', sold: 160, price: 0, stock: 999, badge: 'HOT', img: 'aim', downloadLink: 'https://link4m.com/AI2u7', downloadText: 'Tải Xuống' },
            { id: 19, category: 'DPI', name: 'DPI Redmi', duration: 'MỚI NHẤT', sold: 75, price: 0, stock: 999, badge: '', img: 'file', downloadLink: 'https://link4m.com/8jfhxGcx', downloadText: 'Tải Xuống' },
            { id: 20, category: 'DPI', name: 'DPI Oppo', duration: 'MỚI NHẤT', sold: 90, price: 0, stock: 999, badge: '', img: 'file', downloadLink: 'https://link4m.com/FUyFizy', downloadText: 'Tải Xuống' },
            { id: 21, category: 'TỐI ƯU', name: 'Game Turbo X Pro 4.5', duration: 'MỚI NHẤT', sold: 99, price: 0, stock: 999, badge: 'MỚI', img: 'file', downloadLink: 'https://fnote.net/notes/7Ha4kJ', downloadText: 'Tải Xuống' },
            { id: 22, category: 'TỐI ƯU', name: 'Nebula Touch Premium', duration: 'V1.0.9 BETA', sold: 45, price: 0, stock: 999, badge: 'HOT', img: 'aim', downloadLink: 'https://www.mediafire.com/file/tzp1g3kxn694er1/Nebula+Touch+v1.0.9+Beta_crack.apk/file', downloadText: 'Tải APK' }
        ];

        // ==================== QUẢN LÝ ====================
        function loadCart() { var data = localStorage.getItem('cart'); return data ? JSON.parse(data) : []; }
        function saveCart(cart) { localStorage.setItem('cart', JSON.stringify(cart)); }

        var cart = [];
        var currentFilter = 'all';
        var productGrid = document.getElementById('productGrid');
        var productCountBadge = document.getElementById('productCountBadge');
        var cartOverlay = document.getElementById('cartOverlay');
        var openCartBtn = document.getElementById('openCart');
        var closeCartBtn = document.getElementById('closeCart');
        var cartItemsEl = document.getElementById('cartItems');
        var cartCountEl = document.getElementById('cartCount');
        var cartTotalEl = document.getElementById('cartTotal');
        var checkoutBtn = document.getElementById('checkoutBtn');
        var categoryFilter = document.getElementById('categoryFilter');
        var supportToggle = document.getElementById('supportToggle');
        var supportOptions = document.getElementById('supportOptions');

        function formatPrice(price) { if (price === 0) return 'Miễn phí'; return price.toLocaleString('vi-VN') + ' ₫'; }
        function showShop() { productCountBadge.textContent = products.length + ' sản phẩm'; cart = loadCart(); renderProducts(); updateCartUI(); }

        // ==================== RENDER SẢN PHẨM BẰNG DOM (AN TOÀN) ====================
        function renderProducts() {
            productGrid.innerHTML = '';
            var filteredProducts = products;
            if (currentFilter !== 'all') {
                filteredProducts = products.filter(function(p) { return p.category === currentFilter; });
            }

            filteredProducts.forEach(function(p) {
                var card = document.createElement('div'); card.className = 'product-card';
                var imgDiv = document.createElement('div'); imgDiv.className = 'card-image';
                
                if (p.badge) {
                    var badgeSpan = document.createElement('span'); badgeSpan.className = 'badge'; badgeSpan.textContent = p.badge; imgDiv.appendChild(badgeSpan);
                }
                
                var iconDiv = document.createElement('div');
                if (p.img === 'freefire') { iconDiv.className = 'freefire-icon'; iconDiv.textContent = '🔥'; } 
                else if (p.img === 'aim') { iconDiv.style.fontSize = '2.5rem'; iconDiv.textContent = '🎯'; } 
                else { iconDiv.style.fontSize = '2.5rem'; iconDiv.textContent = '📁'; }
                imgDiv.appendChild(iconDiv);

                var contentDiv = document.createElement('div'); contentDiv.className = 'card-content';
                var catDiv = document.createElement('div'); catDiv.className = 'card-category'; catDiv.textContent = p.category;
                var titleDiv = document.createElement('div'); titleDiv.className = 'card-title'; titleDiv.textContent = p.name;
                
                var metaDiv = document.createElement('div'); metaDiv.className = 'card-meta';
                var durSpan = document.createElement('span'); durSpan.textContent = p.duration;
                var soldSpan = document.createElement('span'); soldSpan.textContent = p.sold + ' đã bán';
                metaDiv.appendChild(durSpan); metaDiv.appendChild(soldSpan);

                var bottomDiv = document.createElement('div'); bottomDiv.className = 'card-bottom';
                var priceDiv = document.createElement('div'); priceDiv.className = 'card-price'; priceDiv.textContent = formatPrice(p.price);
                var stockDiv = document.createElement('div'); stockDiv.className = 'card-stock'; stockDiv.textContent = 'Còn ' + p.stock + ' sản phẩm';

                var btn;
                if (p.downloadLink) {
                    btn = document.createElement('a'); btn.href = p.downloadLink; btn.target = '_blank'; btn.className = 'card-btn download'; btn.textContent = p.downloadText || 'Tải xuống';
                } else {
                    btn = document.createElement('button'); btn.className = 'card-btn'; btn.textContent = 'Thêm vào giỏ'; btn.dataset.id = p.id;
                }

                bottomDiv.appendChild(priceDiv); bottomDiv.appendChild(stockDiv); bottomDiv.appendChild(btn);
                contentDiv.appendChild(catDiv); contentDiv.appendChild(titleDiv); contentDiv.appendChild(metaDiv); contentDiv.appendChild(bottomDiv);
                card.appendChild(imgDiv); card.appendChild(contentDiv);
                productGrid.appendChild(card);
            });
        }

        // ==================== CẬP NHẬT GIỎ HÀNG BẰNG DOM (AN TOÀN) ====================
        function updateCartUI() {
            var totalItems = 0; var totalPrice = 0;
            cart.forEach(function(item) { totalItems += item.qty; totalPrice += item.price * item.qty; });
            cartCountEl.textContent = totalItems;

            cartItemsEl.innerHTML = '';
            if (cart.length === 0) {
                var emptyDiv = document.createElement('div'); emptyDiv.className = 'empty-cart'; emptyDiv.textContent = 'Giỏ hàng trống';
                cartItemsEl.appendChild(emptyDiv);
            } else {
                cart.forEach(function(item) {
                    var itemDiv = document.createElement('div'); itemDiv.className = 'cart-item';
                    var infoDiv = document.createElement('div'); infoDiv.className = 'cart-item-info';
                    var nameSpan = document.createElement('span'); nameSpan.className = 'cart-item-name'; nameSpan.textContent = item.name;
                    var priceSpan = document.createElement('span'); priceSpan.className = 'cart-item-price'; priceSpan.textContent = formatPrice(item.price);
                    infoDiv.appendChild(nameSpan); infoDiv.appendChild(priceSpan);

                    var qtyDiv = document.createElement('div'); qtyDiv.className = 'cart-item-qty';
                    var decBtn = document.createElement('button'); decBtn.className = 'qty-btn'; decBtn.textContent = '−'; decBtn.dataset.id = item.id; decBtn.dataset.action = 'decrease';
                    var qtySpan = document.createElement('span'); qtySpan.textContent = item.qty;
                    var incBtn = document.createElement('button'); incBtn.className = 'qty-btn'; incBtn.textContent = '+'; incBtn.dataset.id = item.id; incBtn.dataset.action = 'increase';
                    var remBtn = document.createElement('button'); remBtn.className = 'remove-btn'; remBtn.textContent = '🗑️'; remBtn.dataset.id = item.id; remBtn.dataset.action = 'remove';
                    qtyDiv.appendChild(decBtn); qtyDiv.appendChild(qtySpan); qtyDiv.appendChild(incBtn); qtyDiv.appendChild(remBtn);
                    
                    itemDiv.appendChild(infoDiv); itemDiv.appendChild(qtyDiv);
                    cartItemsEl.appendChild(itemDiv);
                });
            }
            cartTotalEl.textContent = formatPrice(totalPrice);
        }

        // ==================== XỬ LÝ LOGIC ====================
        function addToCart(id) {
            var product = null;
            for (var i = 0; i < products.length; i++) { if (products[i].id === id) { product = products[i]; break; } }
            if (!product) return;
            var existing = null;
            for (var i = 0; i < cart.length; i++) { if (cart[i].id === id) { existing = cart[i]; break; } }
            if (existing) { existing.qty++; } else { cart.push({ id: product.id, name: product.name, price: product.price, qty: 1 }); }
            saveCart(cart); updateCartUI(); openCart();
        }

        function changeQty(id, action) {
            var item = null; var index = -1;
            for (var i = 0; i < cart.length; i++) { if (cart[i].id === id) { item = cart[i]; index = i; break; } }
            if (!item) return;
            if (action === 'increase') { item.qty++; } 
            else if (action === 'decrease') { item.qty--; if (item.qty <= 0) { cart.splice(index, 1); } } 
            else if (action === 'remove') { cart.splice(index, 1); }
            saveCart(cart); updateCartUI();
        }

        function openCart() { cartOverlay.classList.add('open'); }
        function closeCart() { cartOverlay.classList.remove('open'); }
        function checkout() {
            if (cart.length === 0) { alert('Giỏ hàng của bạn đang trống!'); return; }
            var totalPrice = 0;
            for (var i = 0; i < cart.length; i++) { totalPrice += cart[i].price * cart[i].qty; }
            alert('Cảm ơn bạn đã mua hàng!\nTổng thanh toán: ' + formatPrice(totalPrice));
            cart = []; saveCart(cart); updateCartUI(); closeCart();
        }

        // ==================== GẮN SỰ KIỆN ====================
        categoryFilter.addEventListener('change', function(e) { currentFilter = e.target.value; renderProducts(); });
        productGrid.addEventListener('click', function (e) {
            var target = e.target.closest('button') || e.target.closest('a');
            if (!target) return;
            if (target.classList.contains('card-btn') && !target.classList.contains('download')) {
                addToCart(Number(target.dataset.id));
            }
        });
        cartItemsEl.addEventListener('click', function (e) {
            var target = e.target.closest('button');
            if (!target) return;
            if (target.dataset.id && target.dataset.action) { changeQty(Number(target.dataset.id), target.dataset.action); }
        });
        openCartBtn.addEventListener('click', openCart);
        closeCartBtn.addEventListener('click', closeCart);
        cartOverlay.addEventListener('click', function (e) { if (e.target === cartOverlay) closeCart(); });
        checkoutBtn.addEventListener('click', checkout);

        supportToggle.addEventListener('click', function () {
            supportOptions.classList.toggle('show');
            supportToggle.classList.toggle('active');
            if(supportOptions.classList.contains('show')) { supportToggle.innerHTML = '✖'; } else { supportToggle.innerHTML = '💬'; }
        });

        // ==================== KHỞI TẠO ====================
        showShop();
    </script>
</body>
</html>
