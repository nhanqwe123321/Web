<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bàn tay ảo Neon - Nhiều trò hơn</title>
    <style>
        :root { --accent: #4cc9f0; }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0; min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 14px; padding: 16px;
            background: radial-gradient(circle at 50% 0%, #0d1117, #000000 80%);
            color: #e8eefc; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        h1 { margin: 0; font-size: 18px; font-weight: 600; opacity: .9; letter-spacing: .5px; text-shadow: 0 0 10px rgba(76,201,240,0.5); }
        
        #stage {
            position: relative; width: min(92vw, 900px); aspect-ratio: 4 / 3;
            border-radius: 18px; overflow: hidden; background: #000;
            box-shadow: 0 20px 60px rgba(0,0,0,.8), 0 0 0 1px rgba(76,201,240,0.2);
        }
        
        #video, #canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
        #video { object-fit: cover; transform: scaleX(-1); opacity: .35; transition: opacity .25s; }
        #stage.no-video #video { opacity: 0; }
        #canvas { pointer-events: none; }
        
        #status {
            position: absolute; left: 12px; bottom: 12px; padding: 6px 12px;
            font-size: 12px; border-radius: 8px; color: #9fb3d1;
            background: rgba(0,0,0,.6); backdrop-filter: blur(6px); z-index: 10;
            border: 1px solid rgba(76,201,240,0.2);
        }
        
        #ui-overlay {
            position: absolute; top: 12px; left: 12px; z-index: 10;
            background: rgba(0,0,0,.7); padding: 10px 16px; border-radius: 12px;
            font-size: 14px; backdrop-filter: blur(6px); border: 1px solid rgba(76,201,240,0.3);
            box-shadow: 0 0 20px rgba(76,201,240,0.1);
        }
        #finger-info { font-weight: bold; color: #4cc9f0; font-size: 1.2em; margin-bottom: 4px; text-shadow: 0 0 8px rgba(76,201,240,0.8); }
        
        /* Hiệu ứng chữ neon khi đếm ngón */
        #big-number {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 120px; font-weight: 900; color: #fff; text-shadow: 0 0 20px #4cc9f0, 0 0 40px #4cc9f0, 0 0 80px #f72585;
            opacity: 0; transition: opacity 0.3s, transform 0.3s; z-index: 20; pointer-events: none;
        }
        #big-number.show { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        
        .toolbar { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; z-index: 10; }
        button {
            padding: 9px 18px; font-size: 14px; color: #e8eefc; background: rgba(76,201,240,.1);
            border: 1px solid rgba(76,201,240,.3); border-radius: 999px; cursor: pointer; transition: .2s;
        }
        button:hover { background: rgba(76,201,240,.25); box-shadow: 0 0 15px rgba(76,201,240,0.4); }
        button.active { background: rgba(76,201,240,.3); border-color: var(--accent); box-shadow: 0 0 20px rgba(76,201,240,0.6); }
        #hint { margin: 0; max-width: 640px; font-size: 13px; text-align: center; color: #8ea2c0; z-index: 10; }
        
        /* Confetti CSS */
        .confetti {
            position: fixed; top: -10px; z-index: 9999; pointer-events: none;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <h1>🖐️ Bàn tay ảo Neon</h1>

    <div id="stage">
        <video id="video" playsinline muted></video>
        <canvas id="canvas"></canvas>
        <div id="big-number">5</div>
        
        <div id="ui-overlay">
            <div id="finger-info">✋ Số ngón: -</div>
            <div id="message">Đưa tay vào khung hình nhé!</div>
        </div>
        <div id="status">Đang tải mô hình AI…</div>
    </div>

    <div class="toolbar">
        <button id="btnVideo" class="active">Hiện video</button>
    </div>

    <p id="hint">
        Hãy cho phép trình duyệt truy cập camera rồi giơ tay trước ống kính.
        Trang cần chạy trên <b>https</b> hoặc <b>localhost</b>.
    </p>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

/* ================== CẤU HÌNH ================== */
const VERSION   = "0.10.14";
const WASM_PATH = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VERSION}/wasm`;
const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";

const SMOOTHING = 0.75;  
const NUM_HANDS = 2;     
const STABLE_FRAMES = 8; // Số frame để kích hoạt hiệu ứng

const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4], [0,5],[5,6],[6,7],[7,8], [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16], [13,17],[17,18],[18,19],[19,20], [0,17]
];
const PALM_IDX = [0, 1, 5, 9, 13, 17];
const TIP_IDX  = [4, 8, 12, 16, 20];
const PIP_IDX  = [2, 6, 10, 14, 18]; 

/* ================== PHẦN TỬ DOM ================== */
const VIDEO  = document.getElementById("video");
const CANVAS = document.getElementById("canvas");
const CTX    = CANVAS.getContext("2d");
const STAGE  = document.getElementById("stage");
const STATUS = document.getElementById("status");
const BTN    = document.getElementById("btnVideo");
const FINGER_INFO = document.getElementById("finger-info");
const MESSAGE = document.getElementById("message");
const BIG_NUMBER = document.getElementById("big-number");

/* ================== TRẠNG THÁI ================== */
let handLandmarker = null;
let lastVideoTime  = -1;
let smoothedHands  = [];   
let lastAnimated = -1;
let stableFingers = -1;
let stableCounter = 0;
let particles = []; // Mảng chứa các hạt năng lượng

/* ================== KHỞI TẠO ================== */
async function init() {
  try {
    STATUS.textContent = "Đang tải mô hình AI…";
    const vision = await FilesetResolver.forVisionTasks(WASM_PATH);
    handLandmarker = await HandLandmarker.createFromOptions(vision, {
      baseOptions: { modelAssetPath: MODEL_URL, delegate: "GPU" },
      runningMode: "VIDEO",
      numHands: NUM_HANDS,
      minHandDetectionConfidence: 0.5,
      minHandPresenceConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    STATUS.textContent = "Đang mở camera…";
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" },
      audio: false
    });

    VIDEO.srcObject = stream;
    await new Promise(resolve => {
      if (VIDEO.readyState >= 1) return resolve();
      VIDEO.addEventListener("loadedmetadata", resolve, { once: true });
    });
    await VIDEO.play();

    resizeCanvas();
    STATUS.textContent = "Sẵn sàng — giơ tay lên!";
    requestAnimationFrame(loop);

  } catch (err) {
    console.error(err);
    if (err.name === 'NotAllowedError' || err.message.includes('Permission')) {
        STATUS.textContent = "❌ Lỗi: Quyền truy cập Camera bị từ chối!";
        STATUS.style.color = "#ff8a8a";
        MESSAGE.textContent = "Hãy chạy file qua HTTPS hoặc localhost, không mở trực tiếp từ bộ nhớ máy.";
    } else {
        STATUS.textContent = "Lỗi: " + (err.message || err);
    }
  }
}

function resizeCanvas() {
  const w = VIDEO.videoWidth  || 640;
  const h = VIDEO.videoHeight || 480;
  CANVAS.width  = w;
  CANVAS.height = h;
  STAGE.style.aspectRatio = `${w} / ${h}`;
}

/* ================== VÒNG LẶP ================== */
function loop() {
  if (handLandmarker && VIDEO.readyState >= 2) {
    const now = performance.now();
    if (VIDEO.currentTime !== lastVideoTime) {
      lastVideoTime = VIDEO.currentTime;
      try {
        const result = handLandmarker.detectForVideo(VIDEO, now);
        render(result);
      } catch (e) {
        console.warn(e);
      }
    }
  }
  requestAnimationFrame(loop);
}

/* ================== LÀM MƯỢT ================== */
function smooth(rawHands) {
  const out = [];
  for (let i = 0; i < rawHands.length; i++) {
    const raw = rawHands[i];
    if (!smoothedHands[i]) {
      smoothedHands[i] = raw.map(p => ({ x: p.x, y: p.y, z: p.z }));
    }
    const s = smoothedHands[i];
    for (let j = 0; j < raw.length; j++) {
      s[j].x += (raw[j].x - s[j].x) * SMOOTHING;
      s[j].y += (raw[j].y - s[j].y) * SMOOTHING;
      s[j].z += (raw[j].z - s[j].z) * SMOOTHING;
    }
    out.push(s);
  }
  smoothedHands.length = rawHands.length;
  return out;
}

/* ================== ĐẾM NGÓN TAY ================== */
function countFingers(landmarks) {
    let count = 0;
    for (let i = 1; i < 5; i++) {
        if (landmarks[TIP_IDX[i]].y < landmarks[PIP_IDX[i]].y) count++;
    }
    const thumbTip = landmarks[TIP_IDX[0]];
    const thumbIP = landmarks[PIP_IDX[0]];
    const wrist = landmarks[0];
    const distTip = Math.hypot(thumbTip.x - wrist.x, thumbTip.y - wrist.y);
    const distIP = Math.hypot(thumbIP.x - wrist.x, thumbIP.y - wrist.y);
    if (distTip > distIP * 1.2) count++;
    return count;
}

/* ================== VẼ ================== */
function render(result) {
  const W = CANVAS.width;
  const H = CANVAS.height;

  CTX.setTransform(1, 0, 0, 1, 0, 0);
  CTX.clearRect(0, 0, W, H);

  const hasHand = result && result.landmarks && result.landmarks.length > 0;

  if (!hasHand) {
    stableFingers = -1; stableCounter = 0; lastAnimated = -1;
    FINGER_INFO.textContent = '✋ Số ngón: -';
    MESSAGE.textContent = 'Đưa tay vào khung hình nhé!';
    BIG_NUMBER.classList.remove('show');
    smoothedHands = [];
    particles = [];
    return;
  }

  const hands = smooth(result.landmarks);

  // Đếm ngón tay
  let totalFingers = 0;
  for (const lm of hands) { totalFingers += countFingers(lm); }
  totalFingers = Math.min(totalFingers, 5); 
  FINGER_INFO.textContent = `✋ Số ngón: ${totalFingers}`;

  // Ổn định hóa & hiệu ứng chữ to
  if (totalFingers === stableFingers) {
      stableCounter++;
  } else {
      stableFingers = totalFingers; stableCounter = 0; lastAnimated = -1;
      BIG_NUMBER.classList.remove('show');
  }

  if (stableCounter >= STABLE_FRAMES && lastAnimated !== totalFingers) {
      lastAnimated = totalFingers;
      MESSAGE.textContent = `✅ Đã nhận diện ${totalFingers} ngón tay!`;
      BIG_NUMBER.textContent = totalFingers;
      BIG_NUMBER.classList.add('show');
      setTimeout(() => BIG_NUMBER.classList.remove('show'), 1500);
      spawnConfetti();
  }

  // Vẽ hiệu ứng hạt năng lượng (Particles)
  updateAndDrawParticles(W, H);

  CTX.save();
  CTX.translate(W, 0);
  CTX.scale(-1, 1); 

  // Vẽ bàn tay Neon
  hands.forEach((lm, i) => drawNeonHand(lm, W, H, i));

  // Trò chơi: Quả cầu năng lượng (Pinch Orb)
  hands.forEach((lm) => {
      const thumbTip = lm[4];
      const indexTip = lm[8];
      const dist = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);
      
      if (dist < 0.07) { // Nếu khoảng cách 2 đầu ngón tay < ngưỡng
          const midX = ((thumbTip.x + indexTip.x) / 2) * W;
          const midY = ((thumbTip.y + indexTip.y) / 2) * H;
          const radius = 15 + Math.sin(performance.now() * 0.01) * 8; // Nhấp nháy
          
          CTX.beginPath();
          CTX.arc(midX, midY, radius, 0, Math.PI * 2);
          const gradient = CTX.createRadialGradient(midX, midY, 0, midX, midY, radius);
          gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
          gradient.addColorStop(0.5, 'rgba(76, 201, 240, 0.8)');
          gradient.addColorStop(1, 'rgba(76, 201, 240, 0)');
          CTX.fillStyle = gradient;
          CTX.fill();
      }
  });

  // Trò chơi: Cầu nối 2 tay (Energy Bridge)
  if (hands.length === 2) {
      const tip1 = hands[0][8]; // Ngón trỏ tay 1
      const tip2 = hands[1][8]; // Ngón trỏ tay 2
      const dist = Math.hypot(tip1.x - tip2.x, tip1.y - tip2.y);

      if (dist < 0.3) { // Nếu 2 tay gần nhau
          CTX.beginPath();
          CTX.moveTo(tip1.x * W, tip1.y * H);
          CTX.lineTo(tip2.x * W, tip2.y * H);
          CTX.strokeStyle = `hsla(${(performance.now() * 0.1) % 360}, 100%, 70%, ${1 - dist * 3})`;
          CTX.lineWidth = 4 + Math.sin(performance.now() * 0.02) * 3;
          CTX.shadowBlur = 20;
          CTX.shadowColor = '#4cc9f0';
          CTX.stroke();
          CTX.shadowBlur = 0;
      }
  }

  CTX.restore();
}

/* ================== VẼ BÀN TAY NEON ================== */
function drawNeonHand(lm, W, H, handIndex) {
  const P = lm.map(p => ({ x: p.x * W, y: p.y * H }));
  
  // Màu sắc thay đổi theo vị trí X của bàn tay (Rainbow effect)
  const hue = (P[0].x / W) * 360; 

  CTX.lineCap  = "round";
  CTX.lineJoin = "round";

  // 1. Vẽ xương bàn tay (Neon tube)
  CTX.shadowColor = `hsla(${hue}, 100%, 60%, 0.8)`;
  CTX.shadowBlur = 15;
  CTX.strokeStyle = `hsla(${hue}, 100%, 70%, 0.9)`;
  CTX.lineWidth   = Math.max(6, W * 0.008);

  for (const [a, b] of HAND_CONNECTIONS) {
    CTX.beginPath();
    CTX.moveTo(P[a].x, P[a].y);
    CTX.lineTo(P[b].x, P[b].y);
    CTX.stroke();
  }

  // 2. Vẽ các khớp (Điểm trắng)
  CTX.shadowBlur = 10;
  CTX.fillStyle  = "#ffffff";
  for (let i = 0; i < P.length; i++) {
    const isTip = TIP_IDX.includes(i);
    const r = isTip ? Math.max(6, W * 0.010) : Math.max(4, W * 0.006);
    CTX.beginPath();
    CTX.arc(P[i].x, P[i].y, r, 0, Math.PI * 2);
    CTX.fill();
  }

  // 3. Đầu ngón phát sáng & bắn hạt
  CTX.shadowBlur = 25;
  CTX.fillStyle  = `hsla(${hue}, 100%, 75%, 1)`;
  for (const i of TIP_IDX) {
    CTX.beginPath();
    CTX.arc(P[i].x, P[i].y, Math.max(8, W * 0.014), 0, Math.PI * 2);
    CTX.fill();
    
    // Tạo hạt năng lượng tại đầu ngón
    if (Math.random() > 0.6) {
        particles.push({
            x: P[i].x, y: P[i].y,
            vx: (Math.random() - 0.5) * 4,
            vy: (Math.random() - 0.5) * 4,
            life: 1.0,
            color: `hsla(${hue}, 100%, 70%, `
        });
    }
  }
  CTX.shadowBlur = 0;
}

/* ================== XỬ LÝ HẠT NĂNG LƯỢNG ================== */
function updateAndDrawParticles(W, H) {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.02; // Tốc độ mờ dần
        
        if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
        }

        CTX.beginPath();
        CTX.arc(p.x, p.y, 2 * p.life, 0, Math.PI * 2);
        CTX.fillStyle = p.color + p.life + ')';
        CTX.fill();
    }
}

/* ================== HIỆU ỨNG ================== */
function spawnConfetti() {
  const colors = ['#f72585', '#b5179e', '#7209b7', '#560bad', '#480ca8', '#3a0ca3', '#3f37c9', '#4361ee', '#4895ef', '#4cc9f0'];
  for (let i = 0; i < 20; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.width = c.style.height = (Math.random() * 8 + 4) + 'px';
    c.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3500);
  }
}

/* ================== NÚT ĐIỀU KHIỂN ================== */
BTN.addEventListener("click", () => {
  const hidden = STAGE.classList.toggle("no-video");
  BTN.classList.toggle("active", !hidden);
  BTN.textContent = hidden ? "Hiện video" : "Ẩn video";
});

/* ================== BẮT ĐẦU ================== */
init();
</script>
</body>
</html>
