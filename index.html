<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bàn tay ảo Hologram - Mượt & Đẹp</title>
    <style>
        :root { --accent: #4cc9f0; }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0; min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 12px; padding: 10px;
            background: radial-gradient(circle at 50% 0%, #0d1117, #000000 80%);
            color: #e8eefc; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        h1 { margin: 0; font-size: 18px; font-weight: 600; opacity: .9; letter-spacing: .5px; text-shadow: 0 0 10px rgba(76,201,240,0.5); }
        
        #stage {
            position: relative; width: min(98vw, 1200px); aspect-ratio: 4 / 3;
            border-radius: 18px; overflow: hidden; background: #000;
            box-shadow: 0 20px 60px rgba(0,0,0,.8), 0 0 0 1px rgba(76,201,240,0.2);
            transition: all 0.3s ease;
        }
        #stage:fullscreen { width: 100vw; height: 100vh; aspect-ratio: auto; border-radius: 0; }
        
        #video, #canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
        #video { object-fit: cover; transform: scaleX(-1); opacity: .35; transition: opacity .25s; }
        #stage.no-video #video { opacity: 0; }
        #canvas { pointer-events: none; }
        
        #status {
            position: absolute; left: 12px; bottom: 12px; padding: 6px 12px;
            font-size: 12px; border-radius: 8px; color: #9fb3d1;
            background: rgba(0,0,0,.6); backdrop-filter: blur(6px); z-index: 10;
            border: 1px solid rgba(76,201,240,0.2);
        }
        
        #ui-overlay {
            position: absolute; top: 12px; left: 12px; z-index: 10;
            background: rgba(0,0,0,.7); padding: 10px 16px; border-radius: 12px;
            font-size: 14px; backdrop-filter: blur(6px); border: 1px solid rgba(76,201,240,0.3);
            box-shadow: 0 0 20px rgba(76,201,240,0.1);
        }
        #finger-info { font-weight: bold; color: #4cc9f0; font-size: 1.2em; margin-bottom: 4px; text-shadow: 0 0 8px rgba(76,201,240,0.8); }
        
        .toolbar { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; z-index: 10; }
        button {
            padding: 9px 18px; font-size: 14px; color: #e8eefc; background: rgba(76,201,240,.1);
            border: 1px solid rgba(76,201,240,.3); border-radius: 999px; cursor: pointer; transition: .2s;
        }
        button:hover { background: rgba(76,201,240,.25); box-shadow: 0 0 15px rgba(76,201,240,0.4); }
        button.active { background: rgba(76,201,240,.3); border-color: var(--accent); box-shadow: 0 0 20px rgba(76,201,240,0.6); }
        #hint { margin: 0; max-width: 640px; font-size: 13px; text-align: center; color: #8ea2c0; z-index: 10; }
    </style>
</head>
<body>

    <h1>🖐️ Bàn tay ảo Hologram</h1>

    <div id="stage">
        <video id="video" playsinline muted></video>
        <canvas id="canvas"></canvas>
        
        <div id="ui-overlay">
            <div id="finger-info">✋ Số ngón: -</div>
            <div id="message">Đưa tay vào khung hình nhé!</div>
        </div>
        <div id="status">Đang tải mô hình AI…</div>
    </div>

    <div class="toolbar">
        <button id="btnVideo" class="active">Hiện video</button>
        <button id="btnFullscreen">Toàn màn hình</button>
    </div>

    <p id="hint">
        Hãy cho phép trình duyệt truy cập camera rồi giơ tay trước ống kính.
        Trang cần chạy trên <b>https</b> hoặc <b>localhost</b>.
    </p>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

/* ================== CẤU HÌNH ================== */
const VERSION   = "0.10.14";
const WASM_PATH = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VERSION}/wasm`;
const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";

const SMOOTHING = 0.75;  
const NUM_HANDS = 2;     
const STABLE_FRAMES = 8;

const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4], [0,5],[5,6],[6,7],[7,8], [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16], [13,17],[17,18],[18,19],[19,20], [0,17]
];
const PALM_IDX = [0, 1, 5, 9, 13, 17];
const TIP_IDX  = [4, 8, 12, 16, 20];
const PIP_IDX  = [2, 6, 10, 14, 18]; 

/* ================== PHẦN TỬ DOM ================== */
const VIDEO  = document.getElementById("video");
const CANVAS = document.getElementById("canvas");
const CTX    = CANVAS.getContext("2d");
const STAGE  = document.getElementById("stage");
const STATUS = document.getElementById("status");
const BTN    = document.getElementById("btnVideo");
const BTN_FULLSCREEN = document.getElementById("btnFullscreen");
const FINGER_INFO = document.getElementById("finger-info");
const MESSAGE = document.getElementById("message");

/* ================== TRẠNG THÁI ================== */
let handLandmarker = null;
let lastVideoTime  = -1;
let smoothedHands  = [];   
let lastAnimated = -1;
let stableFingers = -1;
let stableCounter = 0;

/* ================== KHỞI TẠO ================== */
async function init() {
  try {
    STATUS.textContent = "Đang tải mô hình AI…";
    const vision = await FilesetResolver.forVisionTasks(WASM_PATH);
    handLandmarker = await HandLandmarker.createFromOptions(vision, {
      baseOptions: { modelAssetPath: MODEL_URL, delegate: "GPU" },
      runningMode: "VIDEO",
      numHands: NUM_HANDS,
      minHandDetectionConfidence: 0.5,
      minHandPresenceConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    STATUS.textContent = "Đang mở camera…";
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" },
      audio: false
    });

    VIDEO.srcObject = stream;
    await new Promise(resolve => {
      if (VIDEO.readyState >= 1) return resolve();
      VIDEO.addEventListener("loadedmetadata", resolve, { once: true });
    });
    await VIDEO.play();

    resizeCanvas();
    STATUS.textContent = "Sẵn sàng — giơ tay lên!";
    requestAnimationFrame(loop);

  } catch (err) {
    console.error(err);
    if (err.name === 'NotAllowedError' || err.message.includes('Permission')) {
        STATUS.textContent = "❌ Lỗi: Quyền truy cập Camera bị từ chối!";
        STATUS.style.color = "#ff8a8a";
        MESSAGE.textContent = "Hãy chạy file qua HTTPS hoặc localhost.";
    } else {
        STATUS.textContent = "Lỗi: " + (err.message || err);
    }
  }
}

function resizeCanvas() {
  const w = VIDEO.videoWidth  || 640;
  const h = VIDEO.videoHeight || 480;
  CANVAS.width  = w;
  CANVAS.height = h;
  STAGE.style.aspectRatio = `${w} / ${h}`;
}

/* ================== VÒNG LẶP ================== */
function loop() {
  if (handLandmarker && VIDEO.readyState >= 2) {
    const now = performance.now();
    if (VIDEO.currentTime !== lastVideoTime) {
      lastVideoTime = VIDEO.currentTime;
      try {
        const result = handLandmarker.detectForVideo(VIDEO, now);
        render(result);
      } catch (e) {
        console.warn(e);
      }
    }
  }
  requestAnimationFrame(loop);
}

/* ================== LÀM MƯỢT ================== */
function smooth(rawHands) {
  const out = [];
  for (let i = 0; i < rawHands.length; i++) {
    const raw = rawHands[i];
    if (!smoothedHands[i]) {
      smoothedHands[i] = raw.map(p => ({ x: p.x, y: p.y, z: p.z }));
    }
    const s = smoothedHands[i];
    for (let j = 0; j < raw.length; j++) {
      s[j].x += (raw[j].x - s[j].x) * SMOOTHING;
      s[j].y += (raw[j].y - s[j].y) * SMOOTHING;
      s[j].z += (raw[j].z - s[j].z) * SMOOTHING;
    }
    out.push(s);
  }
  smoothedHands.length = rawHands.length;
  return out;
}

/* ================== ĐẾM NGÓN TAY ================== */
function countFingers(landmarks) {
    let count = 0;
    for (let i = 1; i < 5; i++) {
        if (landmarks[TIP_IDX[i]].y < landmarks[PIP_IDX[i]].y) count++;
    }
    const thumbTip = landmarks[TIP_IDX[0]];
    const thumbIP = landmarks[PIP_IDX[0]];
    const wrist = landmarks[0];
    const distTip = Math.hypot(thumbTip.x - wrist.x, thumbTip.y - wrist.y);
    const distIP = Math.hypot(thumbIP.x - wrist.x, thumbIP.y - wrist.y);
    if (distTip > distIP * 1.2) count++;
    return count;
}

/* ================== VẼ ================== */
function render(result) {
  const W = CANVAS.width;
  const H = CANVAS.height;

  CTX.setTransform(1, 0, 0, 1, 0, 0);
  CTX.clearRect(0, 0, W, H);

  const hasHand = result && result.landmarks && result.landmarks.length > 0;

  if (!hasHand) {
    stableFingers = -1; stableCounter = 0; lastAnimated = -1;
    FINGER_INFO.textContent = '✋ Số ngón: -';
    MESSAGE.textContent = 'Đưa tay vào khung hình nhé!';
    smoothedHands = [];
    return;
  }

  const hands = smooth(result.landmarks);

  let totalFingers = 0;
  for (const lm of hands) { totalFingers += countFingers(lm); }
  totalFingers = Math.min(totalFingers, 5); 
  FINGER_INFO.textContent = `✋ Số ngón: ${totalFingers}`;

  // Cập nhật trạng thái ổn định để đổi thông báo
  if (totalFingers === stableFingers) {
      stableCounter++;
  } else {
      stableFingers = totalFingers; stableCounter = 0; lastAnimated = -1;
  }

  if (stableCounter >= STABLE_FRAMES && lastAnimated !== totalFingers) {
      lastAnimated = totalFingers;
      if (totalFingers === 5) MESSAGE.textContent = `🌟 Xòe tay!`;
      else if (totalFingers === 3) MESSAGE.textContent = `⚡ Ba ngón!`;
      else if (totalFingers === 2) MESSAGE.textContent = `✌️ Chiến thắng!`;
      else if (totalFingers === 1) MESSAGE.textContent = `☝️ Một ngón!`;
      else if (totalFingers === 0) MESSAGE.textContent = `✊ Nắm tay!`;
  }

  CTX.save();
  CTX.translate(W, 0);
  CTX.scale(-1, 1); 

  // Vẽ bàn tay Hologram
  hands.forEach((lm, i) => drawHologramHand(lm, W, H, i));

  // Trò chơi: Quả cầu năng lượng (Pinch) - Tối giản để không lag
  hands.forEach((lm) => {
      const thumbTip = lm[4];
      const indexTip = lm[8];
      const dist = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);
      
      if (dist < 0.07) { 
          const midX = ((thumbTip.x + indexTip.x) / 2) * W;
          const midY = ((thumbTip.y + indexTip.y) / 2) * H;
          const radius = 15 + Math.sin(performance.now() * 0.01) * 5; 
          
          // Vẽ quả cầu đơn giản (không dùng gradient phức tạp)
          CTX.beginPath();
          CTX.arc(midX, midY, radius, 0, Math.PI * 2);
          CTX.fillStyle = 'rgba(76, 201, 240, 0.4)';
          CTX.fill();
          CTX.strokeStyle = '#ffffff';
          CTX.lineWidth = 2;
          CTX.stroke();
      }
  });

  // Cầu nối 2 tay - Tối giản
  if (hands.length === 2) {
      const tip1 = hands[0][8]; 
      const tip2 = hands[1][8]; 
      const dist = Math.hypot(tip1.x - tip2.x, tip1.y - tip2.y);

      if (dist < 0.3) { 
          CTX.beginPath();
          CTX.moveTo(tip1.x * W, tip1.y * H);
          CTX.lineTo(tip2.x * W, tip2.y * H);
          CTX.strokeStyle = `rgba(76, 201, 240, ${1 - dist * 3})`;
          CTX.lineWidth = 3;
          CTX.setLineDash([5, 5]); // Nét đứt cho nhẹ
          CTX.stroke();
          CTX.setLineDash([]);
      }
  }

  CTX.restore();
}

/* ================== VẼ BÀN TAY HOLOGRAM CHÂN THỰC ================== */
function drawHologramHand(lm, W, H, handIndex) {
  const P = lm.map(p => ({ x: p.x * W, y: p.y * H }));
  
  // Màu sắc: Xanh lam (Cyan) cho tay 1, Tím (Purple) cho tay 2
  const hue = handIndex === 0 ? 190 : 280; 

  CTX.lineCap  = "round";
  CTX.lineJoin = "round";

  // 1. Vẽ lòng bàn tay (Palm) - Tạo khối 3D
  const palm = PALM_IDX.map(i => P[i]);
  CTX.beginPath();
  CTX.moveTo(palm[0].x, palm[0].y);
  for (let i = 1; i < palm.length; i++) CTX.lineTo(palm[i].x, palm[i].y);
  CTX.closePath();
  
  // Gradient tạo cảm giác cong của lòng bàn tay
  const grad = CTX.createRadialGradient(palm[0].x, palm[0].y, 10, palm[0].x, palm[0].y, W * 0.3);
  grad.addColorStop(0, `hsla(${hue}, 100%, 70%, 0.35)`);
  grad.addColorStop(1, `hsla(${hue+40}, 100%, 50%, 0.05)`);
  CTX.fillStyle = grad;
  CTX.fill();

  // 2. Vẽ các ngón tay (Fingers) - Nét dày như khối cầu
  CTX.strokeStyle = `hsla(${hue}, 100%, 65%, 0.85)`;
  CTX.lineWidth   = Math.max(8, W * 0.012); // Nét dày hơn để giống ngón tay thật

  for (const [a, b] of HAND_CONNECTIONS) {
    CTX.beginPath();
    CTX.moveTo(P[a].x, P[a].y);
    CTX.lineTo(P[b].x, P[b].y);
    CTX.stroke();
  }

  // 3. Vẽ viền sáng bên trong (Inner Highlight) để tạo độ chân thực
  CTX.strokeStyle = `hsla(${hue}, 100%, 90%, 0.4)`;
  CTX.lineWidth   = Math.max(2, W * 0.003);
  for (const [a, b] of HAND_CONNECTIONS) {
    CTX.beginPath();
    CTX.moveTo(P[a].x, P[a].y);
    CTX.lineTo(P[b].x, P[b].y);
    CTX.stroke();
  }

  // 4. Vẽ các khớp (Joints) - Nhỏ và tinh tế
  CTX.fillStyle = "#ffffff";
  for (let i = 0; i < P.length; i++) {
    const isTip = TIP_IDX.includes(i);
    const r = isTip ? Math.max(5, W * 0.008) : Math.max(3, W * 0.004);
    CTX.beginPath();
    CTX.arc(P[i].x, P[i].y, r, 0, Math.PI * 2);
    CTX.fill();
  }

  // 5. Đầu ngón phát sáng (Fingertips Glow) - Nhấp nháy nhẹ
  const pulse = 1 + Math.sin(performance.now() * 0.005) * 0.2;
  CTX.fillStyle = `hsla(${hue}, 100%, 85%, 1)`;
  for (const i of TIP_IDX) {
    CTX.beginPath();
    CTX.arc(P[i].x, P[i].y, Math.max(7, W * 0.012) * pulse, 0, Math.PI * 2);
    CTX.fill();
  }
}

/* ================== NÚT ĐIỀU KHIỂN ================== */
BTN.addEventListener("click", () => {
  const hidden = STAGE.classList.toggle("no-video");
  BTN.classList.toggle("active", !hidden);
  BTN.textContent = hidden ? "Hiện video" : "Ẩn video";
});

BTN_FULLSCREEN.addEventListener("click", () => {
  if (!document.fullscreenElement) {
    STAGE.requestFullscreen().catch(err => {
      console.error(`Lỗi khi bật toàn màn hình: ${err.message}`);
    });
  } else {
    document.exitFullscreen();
  }
});

document.addEventListener("fullscreenchange", () => {
  if (document.fullscreenElement) {
    BTN_FULLSCREEN.textContent = "Thoát toàn màn hình";
  } else {
    BTN_FULLSCREEN.textContent = "Toàn màn hình";
  }
});

/* ================== BẮT ĐẦU ================== */
init();
</script>
</body>
</html>
