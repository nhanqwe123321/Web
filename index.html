<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cửa Hàng Tiện Ích</title>
    <style>
        :root {
            --bg-body: #0a0e17;
            --bg-card: #131a26;
            --bg-input: #1f2937;
            --border-color: #21262d;
            --border-hover: #30363d;
            --text-main: #c9d1d9;
            --text-white: #ffffff;
            --text-muted: #8b949e;
            --blue: #3b82f6;
            --blue-hover: #2563eb;
            --green: #00ff88;
            --orange: #fbbf24;
            --danger: #f87171;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body { 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            min-height: 100vh; 
            padding: 20px 16px; 
            display: block; 
            line-height: 1.5;
        }

        /* ---------- HEADER ---------- */
        .shop-container { width: 100%; max-width: 900px; margin: 0 auto; }
        
        .top-header { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 20px; flex-wrap: wrap; gap: 12px; 
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .logo-icon { 
            width: 36px; height: 36px; background: var(--bg-input); 
            border-radius: 10px; display: flex; align-items: center; 
            justify-content: center; color: var(--green); font-size: 1.2rem; font-weight: bold; 
        }
        .brand-info p { font-size: 0.85rem; color: var(--blue); font-weight: bold; }
        .product-count-badge { 
            background: #1e3a5f; color: #60a5fa; padding: 4px 12px; 
            border-radius: 20px; font-size: 0.8rem; font-weight: bold; 
        }
        
        .cart-btn { 
            background: var(--bg-input); color: var(--text-white); 
            border: 1px solid var(--border-hover); padding: 8px 16px; 
            border-radius: 20px; font-weight: bold; font-size: 0.85rem; 
            cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s;
        }
        .cart-btn:hover { background: #374151; }
        .cart-count { 
            background: var(--blue); color: white; border-radius: 50%; 
            width: 20px; height: 20px; display: flex; align-items: center; 
            justify-content: center; font-size: 0.7rem; font-weight: bold; 
        }

        /* ---------- SUB HEADER ---------- */
        .sub-header { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 16px; padding: 0 4px; 
        }
        .sub-header-left { display: flex; align-items: center; gap: 12px; }
        .category-select { 
            background: var(--bg-card); color: var(--text-main); 
            border: 1px solid var(--border-hover); padding: 6px 12px; 
            border-radius: 8px; font-size: 0.85rem; outline: none; cursor: pointer; 
        }
        .collapse-btn { 
            background: var(--bg-card); color: var(--text-main); 
            border: 1px solid var(--border-hover); padding: 6px 12px; 
            border-radius: 8px; font-size: 0.85rem; cursor: pointer; 
            display: flex; align-items: center; gap: 4px; transition: 0.2s;
        }
        .collapse-btn:hover { background: var(--bg-input); }

        /* ---------- PRODUCT GRID ---------- */
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        @media (min-width: 768px) { 
            .product-grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; } 
        }

        /* ---------- PRODUCT CARD ---------- */
        .product-card { 
            background: var(--bg-card); border-radius: 16px; 
            border: 1px solid var(--border-color); overflow: hidden; 
            display: flex; flex-direction: column; transition: transform 0.2s;
        }
        .product-card:hover { border-color: var(--border-hover); }
        
        .card-image { 
            background: #0d1117; padding: 20px 10px; 
            display: flex; justify-content: center; align-items: center; 
            position: relative; min-height: 120px; 
        }
        .badge { 
            position: absolute; top: 10px; left: 10px; 
            background: #78350f; color: var(--orange); 
            font-size: 0.55rem; font-weight: bold; padding: 3px 6px; 
            border-radius: 4px; text-transform: uppercase; 
        }
        .freefire-icon { 
            width: 60px; height: 60px; 
            background: linear-gradient(135deg, #ff6b00, #ff0055); 
            border-radius: 15px; display: flex; align-items: center; 
            justify-content: center; font-size: 2rem; 
            box-shadow: 0 0 20px rgba(255, 107, 0, 0.4); transform: rotate(-5deg); 
        }

        .card-content { padding: 12px; display: flex; flex-direction: column; flex: 1; }
        .card-category { color: var(--blue); font-size: 0.65rem; font-weight: bold; text-transform: uppercase; margin-bottom: 4px; }
        .card-title { color: var(--text-white); font-size: 0.85rem; font-weight: bold; margin-bottom: 8px; line-height: 1.3; }
        .card-meta { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
        .card-meta span { color: var(--text-muted); font-size: 0.7rem; }
        
        .card-bottom { margin-top: auto; }
        .card-price { color: var(--green); font-size: 0.9rem; font-weight: bold; margin-bottom: 4px; }
        .card-stock { color: var(--text-muted); font-size: 0.7rem; margin-bottom: 10px; }
        
        .card-btn { 
            width: 100%; padding: 8px; background: var(--bg-input); 
            color: #e5e7eb; border: 1px solid #374151; border-radius: 8px; 
            font-weight: bold; font-size: 0.75rem; cursor: pointer; 
            text-align: center; text-decoration: none; display: block; transition: 0.2s;
        }
        .card-btn:hover { background: #374151; color: var(--text-white); }
        .card-btn.download { background: var(--blue-hover); color: white; border-color: var(--blue-hover); }
        .card-btn.download:hover { background: var(--blue); }

        /* ---------- CART OVERLAY ---------- */
        .cart-overlay { 
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
            background: rgba(0, 0, 0, 0.7); display: none; 
            justify-content: flex-end; z-index: 1000; 
            animation: fadeIn 0.2s ease;
        }
        .cart-overlay.open { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .cart-panel { 
            background: var(--bg-card); width: 100%; max-width: 400px; 
            height: 100%; padding: 24px; display: flex; flex-direction: column; 
            overflow-y: auto; border-left: 1px solid var(--border-color); 
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .cart-header h2 { font-size: 1.2rem; color: var(--text-white); }
        .close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.8rem; cursor: pointer; line-height: 1; }
        .close-btn:hover { color: var(--text-white); }
        
        .cart-items { flex: 1; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
        .cart-item-info { display: flex; flex-direction: column; gap: 4px; }
        .cart-item-name { font-weight: bold; color: var(--text-white); font-size: 0.9rem; }
        .cart-item-price { color: var(--text-muted); font-size: 0.8rem; }
        
        .cart-item-qty { display: flex; align-items: center; gap: 8px; }
        .qty-btn { 
            width: 28px; height: 28px; border: 1px solid var(--border-hover); 
            background: var(--bg-input); color: var(--text-main); 
            border-radius: 6px; cursor: pointer; font-weight: bold; 
            display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }
        .qty-btn:hover { background: #374151; }
        .remove-btn { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 1.1rem; margin-left: 4px; }
        
        .cart-total { 
            display: flex; justify-content: space-between; font-size: 1.1rem; 
            font-weight: bold; padding: 16px 0; border-top: 2px solid var(--border-color); 
            margin-top: 12px; color: var(--text-white); 
        }
        .checkout-btn { 
            background: var(--blue-hover); color: white; border: none; 
            padding: 14px; border-radius: 10px; font-weight: bold; 
            font-size: 1rem; cursor: pointer; transition: 0.2s;
        }
        .checkout-btn:hover { background: var(--blue); }
        .empty-cart { text-align: center; color: var(--text-muted); padding: 40px 0; font-size: 0.9rem; }

        /* ---------- SUPPORT WIDGET (ZALO) ---------- */
        .support-widget { 
            position: fixed; bottom: 20px; right: 20px; 
            display: flex; flex-direction: column; align-items: flex-end; 
            gap: 10px; z-index: 9999; 
        }
        .support-options { 
            display: flex; flex-direction: column; gap: 10px; 
            opacity: 0; visibility: hidden; transform: translateY(10px); 
            transition: all 0.3s ease; 
        }
        .support-options.show { opacity: 1; visibility: visible; transform: translateY(0); }
        
        .support-btn { 
            display: flex; align-items: center; justify-content: center; 
            gap: 8px; padding: 10px 18px; border-radius: 25px; 
            text-decoration: none; color: white; font-weight: bold; 
            font-size: 0.85rem; box-shadow: 0 4px 15px rgba(0,0,0,0.4); 
            transition: transform 0.2s, background 0.2s; min-width: 120px; 
        }
        .support-btn:hover { transform: scale(1.05); }
        .zalo-btn { background: #0068FF; }
        .zalo-btn:hover { background: #0055cc; }
        
        .support-toggle { 
            width: 55px; height: 55px; border-radius: 50%; 
            background: var(--blue-hover); color: white; border: none; 
            font-size: 1.6rem; cursor: pointer; 
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.5); 
            display: flex; align-items: center; justify-content: center; 
            transition: all 0.3s ease; 
        }
        .support-toggle:hover { background: var(--blue); transform: scale(1.1); }
        .support-toggle.active { transform: rotate(45deg); background: #1e40af; }
    </style>
</head>
<body>

    <!-- SHOP CONTAINER -->
    <div id="shopSection" class="shop-container">
        <!-- Header -->
        <div class="top-header">
            <div class="header-left">
                <div class="logo-icon">⬡</div>
                <div class="brand-info"><p>Cửa hàng tiện ích</p></div>
                <span class="product-count-badge" id="productCountBadge">0 sản phẩm</span>
            </div>
            <div class="header-right">
                <button class="cart-btn" id="openCart">🛍️ <span class="cart-count" id="cartCount">0</span></button>
            </div>
        </div>

        <!-- Filter -->
        <div class="sub-header">
            <div class="sub-header-left">
                <select class="category-select" id="categoryFilter">
                    <option value="all">Tất cả</option>
                    <option value="GAME">GAME</option>
                    <option value="AIMLOCK">AIMLOCK</option>
                    <option value="TỐI ƯU">TỐI ƯU</option>
                </select>
            </div>
            <button class="collapse-btn">Thu gọn ▸</button>
        </div>

        <!-- Product List -->
        <main><div class="product-grid" id="productGrid"></div></main>

        <!-- Cart -->
        <div class="cart-overlay" id="cartOverlay">
            <div class="cart-panel">
                <div class="cart-header">
                    <h2>Giỏ hàng</h2>
                    <button class="close-btn" id="closeCart">&times;</button>
                </div>
                <div class="cart-items" id="cartItems"></div>
                <div class="cart-total"><span>Tổng cộng:</span><span id="cartTotal">0 ₫</span></div>
                <button class="checkout-btn" id="checkoutBtn">Thanh toán</button>
            </div>
        </div>
    </div>

    <!-- Support Widget -->
    <div class="support-widget">
        <div class="support-options" id="supportOptions">
            <a href="https://zalo.me/0907415055" target="_blank" class="support-btn zalo-btn"><span>💬</span> Zalo</a>
        </div>
        <button class="support-toggle" id="supportToggle">💬</button>
    </div>

    <script>
        // ==================== DỮ LIỆU SẢN PHẨM ====================
        const products = [
            { id: 1, category: 'GAME', name: 'Định vị moco', duration: 'VĨNH VIỄN', sold: 99, price: 0, stock: 999, badge: 'HOT', img: 'freefire', downloadLink: 'https://www.mediafire.com/file/rbh9kfdmzz9wnh4/Dragon_Injector_V2.apk/file', downloadText: 'Tải APK' },
            { id: 8, category: 'AIMLOCK', name: 'File Aimlock 💝', duration: 'MỚI NHẤT', sold: 300, price: 0, stock: 999, badge: 'HOT', img: 'aim', downloadLink: 'https://link4m.com/V6Jii8', downloadText: 'Tải Xuống' },
            { id: 21, category: 'TỐI ƯU', name: 'Game Turbo X Pro 4.5', duration: 'MỚI NHẤT', sold: 99, price: 0, stock: 999, badge: 'MỚI', img: 'file', downloadLink: 'https://fnote.net/notes/7Ha4kJ', downloadText: 'Tải Xuống' },
            { id: 22, category: 'TỐI ƯU', name: 'Nebula Touch Premium', duration: 'V1.0.9 BETA', sold: 45, price: 0, stock: 999, badge: 'HOT', img: 'aim', downloadLink: 'https://www.mediafire.com/file/tzp1g3kxn694er1/Nebula+Touch+v1.0.9+Beta_crack.apk/file', downloadText: 'Tải APK' },
            // Sản phẩm mới được thêm vào đây
            { id: 23, category: 'AIMLOCK', name: 'Aimlock Mode', duration: 'MỚI NHẤT', sold: 0, price: 0, stock: 999, badge: 'MỚI', img: 'aim', downloadLink: 'https://www.mediafire.com/file/drcdhofk7fc7s0u/', downloadText: 'Tải Xuống' },
            { id: 24, category: 'AIMLOCK', name: 'Aimlock Plus', duration: 'MỚI NHẤT', sold: 0, price: 0, stock: 999, badge: 'MỚI', img: 'aim', downloadLink: 'https://www.mediafire.com/file/ofymzx6bv4a39t4/AIMLOCK+H%E1%BB%96+TR%E1%BB%A2+FULL+%C4%90%E1%BB%8E+!!!!%F0%9F%AA%BD.zip/file', downloadText: 'Tải Xuống' }
        ];

        // ==================== STATE MANAGEMENT ====================
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let currentFilter = 'all';

        // ==================== DOM ELEMENTS ====================
        const productGrid = document.getElementById('productGrid');
        const productCountBadge = document.getElementById('productCountBadge');
        const cartOverlay = document.getElementById('cartOverlay');
        const openCartBtn = document.getElementById('openCart');
        const closeCartBtn = document.getElementById('closeCart');
        const cartItemsEl = document.getElementById('cartItems');
        const cartCountEl = document.getElementById('cartCount');
        const cartTotalEl = document.getElementById('cartTotal');
        const checkoutBtn = document.getElementById('checkoutBtn');
        const categoryFilter = document.getElementById('categoryFilter');
        const supportToggle = document.getElementById('supportToggle');
        const supportOptions = document.getElementById('supportOptions');

        // ==================== HELPERS ====================
        const createEl = (tag, className = '', text = '') => {
            const el = document.createElement(tag);
            if (className) el.className = className;
            if (text) el.textContent = text;
            return el;
        };

        const formatPrice = (price) => price === 0 ? 'Miễn phí' : price.toLocaleString('vi-VN') + ' ₫';

        const saveCart = () => localStorage.setItem('cart', JSON.stringify(cart));

        const updateCartCount = () => {
            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            cartCountEl.textContent = totalItems;
        };

        // ==================== RENDER FUNCTIONS ====================
        function renderProducts() {
            productCountBadge.textContent = products.length + ' sản phẩm';
            productGrid.innerHTML = '';
            
            const filtered = currentFilter === 'all' ? products : products.filter(p => p.category === currentFilter);
            const fragment = document.createDocumentFragment();

            filtered.forEach(p => {
                const card = createEl('div', 'product-card');
                
                // Image Section
                const imgDiv = createEl('div', 'card-image');
                if (p.badge) imgDiv.appendChild(createEl('span', 'badge', p.badge));
                
                const iconDiv = createEl('div');
                if (p.img === 'freefire') {
                    iconDiv.className = 'freefire-icon';
                    iconDiv.textContent = '🔥';
                } else if (p.img === 'aim') {
                    iconDiv.style.fontSize = '2.5rem';
                    iconDiv.textContent = '🎯';
                } else {
                    iconDiv.style.fontSize = '2.5rem';
                    iconDiv.textContent = '📁';
                }
                imgDiv.appendChild(iconDiv);

                // Content Section
                const contentDiv = createEl('div', 'card-content');
                contentDiv.appendChild(createEl('div', 'card-category', p.category));
                contentDiv.appendChild(createEl('div', 'card-title', p.name));
                
                const metaDiv = createEl('div', 'card-meta');
                metaDiv.appendChild(createEl('span', '', p.duration));
                metaDiv.appendChild(createEl('span', '', p.sold + ' đã bán'));
                contentDiv.appendChild(metaDiv);

                const bottomDiv = createEl('div', 'card-bottom');
                bottomDiv.appendChild(createEl('div', 'card-price', formatPrice(p.price)));
                bottomDiv.appendChild(createEl('div', 'card-stock', 'Còn ' + p.stock + ' sản phẩm'));

                let btn;
                if (p.downloadLink) {
                    btn = createEl('a', 'card-btn download', p.downloadText || 'Tải xuống');
                    btn.href = p.downloadLink;
                    btn.target = '_blank';
                } else {
                    btn = createEl('button', 'card-btn', 'Thêm vào giỏ');
                    btn.dataset.id = p.id;
                }
                bottomDiv.appendChild(btn);

                contentDiv.appendChild(bottomDiv);
                card.appendChild(imgDiv);
                card.appendChild(contentDiv);
                fragment.appendChild(card);
            });

            productGrid.appendChild(fragment);
        }

        function renderCart() {
            updateCartCount();
            cartItemsEl.innerHTML = '';
            
            if (cart.length === 0) {
                cartItemsEl.appendChild(createEl('div', 'empty-cart', 'Giỏ hàng trống'));
                cartTotalEl.textContent = formatPrice(0);
                return;
            }

            const fragment = document.createDocumentFragment();
            let totalPrice = 0;

            cart.forEach(item => {
                totalPrice += item.price * item.qty;
                const itemDiv = createEl('div', 'cart-item');
                
                const infoDiv = createEl('div', 'cart-item-info');
                infoDiv.appendChild(createEl('span', 'cart-item-name', item.name));
                infoDiv.appendChild(createEl('span', 'cart-item-price', formatPrice(item.price)));

                const qtyDiv = createEl('div', 'cart-item-qty');
                
                const decBtn = createEl('button', 'qty-btn', '−');
                decBtn.dataset.id = item.id;
                decBtn.dataset.action = 'decrease';

                const qtySpan = createEl('span', '', item.qty);

                const incBtn = createEl('button', 'qty-btn', '+');
                incBtn.dataset.id = item.id;
                incBtn.dataset.action = 'increase';

                const remBtn = createEl('button', 'remove-btn', '🗑️');
                remBtn.dataset.id = item.id;
                remBtn.dataset.action = 'remove';

                qtyDiv.append(decBtn, qtySpan, incBtn, remBtn);
                itemDiv.append(infoDiv, qtyDiv);
                fragment.appendChild(itemDiv);
            });

            cartItemsEl.appendChild(fragment);
            cartTotalEl.textContent = formatPrice(totalPrice);
        }

        // ==================== CART LOGIC ====================
        function addToCart(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;

            const existingItem = cart.find(item => item.id === id);
            if (existingItem) {
                existingItem.qty++;
            } else {
                cart.push({ id: product.id, name: product.name, price: product.price, qty: 1 });
            }
            saveCart();
            renderCart();
            openCart();
        }

        function changeQty(id, action) {
            const index = cart.findIndex(item => item.id === id);
            if (index === -1) return;

            if (action === 'increase') {
                cart[index].qty++;
            } else if (action === 'decrease') {
                cart[index].qty--;
                if (cart[index].qty <= 0) cart.splice(index, 1);
            } else if (action === 'remove') {
                cart.splice(index, 1);
            }
            saveCart();
            renderCart();
        }

        function openCart() { cartOverlay.classList.add('open'); }
        function closeCart() { cartOverlay.classList.remove('open'); }

        function checkout() {
            if (cart.length === 0) return alert('Giỏ hàng của bạn đang trống!');
            const totalPrice = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
            alert('Cảm ơn bạn đã mua hàng!\nTổng thanh toán: ' + formatPrice(totalPrice));
            cart = [];
            saveCart();
            renderCart();
            closeCart();
        }

        // ==================== EVENT LISTENERS ====================
        categoryFilter.addEventListener('change', (e) => {
            currentFilter = e.target.value;
            renderProducts();
        });

        productGrid.addEventListener('click', (e) => {
            const target = e.target.closest('.card-btn');
            if (target && !target.classList.contains('download')) {
                addToCart(Number(target.dataset.id));
            }
        });

        cartItemsEl.addEventListener('click', (e) => {
            const target = e.target.closest('button');
            if (target && target.dataset.id && target.dataset.action) {
                changeQty(Number(target.dataset.id), target.dataset.action);
            }
        });

        openCartBtn.addEventListener('click', openCart);
        closeCartBtn.addEventListener('click', closeCart);
        cartOverlay.addEventListener('click', (e) => { if (e.target === cartOverlay) closeCart(); });
        checkoutBtn.addEventListener('click', checkout);

        // Support Widget Toggle
        supportToggle.addEventListener('click', () => {
            supportOptions.classList.toggle('show');
            supportToggle.classList.toggle('active');
            supportToggle.innerHTML = supportOptions.classList.contains('show') ? '✖' : '💬';
        });

        // ==================== INIT ====================
        renderProducts();
        renderCart();
    </script>
</body>
</html>
