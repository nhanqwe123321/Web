<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bàn tay ảo chân thực - Mượt</title>
    <style>
        :root { --accent: #4cc9f0; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; margin: 0; }
        
        body {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 10px; padding: 8px;
            background: radial-gradient(circle at 50% 0%, #0d1117, #000 80%);
            color: #e8eefc; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            width: 100vw; height: 100vh;
        }
        
        h1 { margin: 0; font-size: 15px; font-weight: 600; opacity: .85; letter-spacing: .5px;
             text-shadow: 0 0 10px rgba(76,201,240,0.5); }
        
        #stage {
            position: relative;
            --ar: 4 / 3; /* tỉ lệ thật của camera, JS sẽ cập nhật lại khi có dữ liệu video */
            width: min(98vw, calc(98vh * var(--ar)));
            aspect-ratio: var(--ar);
            max-width: 98vw;
            max-height: 98vh;
            border-radius: 14px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 15px 50px rgba(0,0,0,.8), 0 0 0 1px rgba(76,201,240,0.25);
        }
        #stage:fullscreen {
            width: min(100vw, calc(100vh * var(--ar)));
            max-width: 100vw;
            max-height: 100vh;
            border-radius: 0;
            box-shadow: none;
        }
        
        #video, #canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
        #video { object-fit: cover; transform: scaleX(-1); opacity: .3; transition: opacity .25s; }
        #stage.no-video #video { opacity: 0; }
        #canvas { pointer-events: none; }
        
        #ui-overlay {
            position: absolute; top: 10px; left: 10px; z-index: 10;
            background: rgba(0,0,0,.7); padding: 8px 14px; border-radius: 10px;
            font-size: 13px; backdrop-filter: blur(6px);
            border: 1px solid rgba(76,201,240,0.3);
        }
        #finger-info { font-weight: bold; color: #4cc9f0; font-size: 1.1em; }
        
        #status {
            position: absolute; left: 10px; bottom: 10px; padding: 5px 10px;
            font-size: 11px; border-radius: 6px; color: #9fb3d1;
            background: rgba(0,0,0,.6); backdrop-filter: blur(6px); z-index: 10;
            border: 1px solid rgba(76,201,240,0.2);
        }
        
        .toolbar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
        button {
            padding: 8px 16px; font-size: 13px; color: #e8eefc; background: rgba(76,201,240,.1);
            border: 1px solid rgba(76,201,240,.3); border-radius: 999px; cursor: pointer; transition: .2s;
        }
        button:hover { background: rgba(76,201,240,.25); }
        button.active { background: rgba(76,201,240,.3); border-color: var(--accent); }
        
        #hint { margin: 0; font-size: 11px; text-align: center; color: #8ea2c0; max-width: 90vw; }
        
        @media (max-height: 500px) {
            h1 { font-size: 12px; }
            #hint { display: none; }
        }
    </style>
</head>
<body>

    <h1>🖐️ Bàn tay ảo chân thực</h1>

    <div id="stage">
        <video id="video" playsinline muted autoplay></video>
        <canvas id="canvas"></canvas>
        
        <div id="ui-overlay">
            <div id="finger-info">✋ Số ngón: -</div>
        </div>
        <div id="status">Đang tải AI…</div>
    </div>

    <div class="toolbar">
        <button id="btnVideo" class="active">Hiện video</button>
        <button id="btnFullscreen">Toàn màn hình</button>
    </div>

    <p id="hint">Chạy trên <b>https</b> hoặc <b>localhost</b> để camera hoạt động</p>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

/* ================== CẤU HÌNH ================== */
const VERSION   = "0.10.14";
const WASM_PATH = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VERSION}/wasm`;
const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";

const SMOOTHING = 0.88;
const NUM_HANDS = 2;

/* ĐỘ DÀY TƯƠNG ĐỐI CỦA TỪNG ĐỐT XƯƠNG */
const BONES = [
  [0,1,1.0],[1,2,0.82],[2,3,0.66],[3,4,0.5],
  [0,5,1.0],[5,6,0.82],[6,7,0.66],[7,8,0.5],
  [5,9,0.95],[9,10,0.85],[10,11,0.68],[11,12,0.5],
  [9,13,0.9],[13,14,0.78],[14,15,0.62],[15,16,0.46],
  [13,17,0.82],[17,18,0.68],[18,19,0.52],[19,20,0.38],
  [0,17,0.7]
];

const TIP_IDX = [4, 8, 12, 16, 20];
const PIP_IDX = [2, 6, 10, 14, 18];
const PALM_IDX = [0, 1, 5, 9, 13, 17];

/* ================== DOM ================== */
const VIDEO  = document.getElementById("video");
const CANVAS = document.getElementById("canvas");
const CTX    = CANVAS.getContext("2d", { alpha: true });
const STAGE  = document.getElementById("stage");
const STATUS = document.getElementById("status");
const BTN    = document.getElementById("btnVideo");
const BTN_FS = document.getElementById("btnFullscreen");
const FINGER_INFO = document.getElementById("finger-info");

/* ================== TRẠNG THÁI ================== */
let handLandmarker = null;
let lastVideoTime  = -1;
let smoothedHands  = [];
let fpsCounter = 0, lastFpsTime = 0, currentFps = 0;

/* ================== KHỞI TẠO ================== */
async function init() {
  try {
    STATUS.textContent = "Đang tải mô hình AI…";
    const vision = await FilesetResolver.forVisionTasks(WASM_PATH);
    handLandmarker = await HandLandmarker.createFromOptions(vision, {
      baseOptions: { modelAssetPath: MODEL_URL, delegate: "GPU" },
      runningMode: "VIDEO",
      numHands: NUM_HANDS,
      minHandDetectionConfidence: 0.5,
      minHandPresenceConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    STATUS.textContent = "Đang mở camera…";
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 480 }, height: { ideal: 360 }, facingMode: "user" },
      audio: false
    });

    VIDEO.srcObject = stream;
    await new Promise(resolve => {
      if (VIDEO.readyState >= 1) return resolve();
      VIDEO.addEventListener("loadedmetadata", resolve, { once: true });
    });
    await VIDEO.play();

    resizeCanvas();
    STATUS.textContent = "Sẵn sàng!";
    setTimeout(() => STATUS.style.opacity = '0.5', 2000);
    requestAnimationFrame(loop);

  } catch (err) {
    console.error(err);
    if (err.name === 'NotAllowedError' || err.message.includes('Permission')) {
        STATUS.textContent = "❌ Lỗi camera - Hãy chạy qua HTTPS/localhost";
        STATUS.style.color = "#ff8a8a";
    } else {
        STATUS.textContent = "Lỗi: " + (err.message || err);
    }
  }
}

function resizeCanvas() {
  const w = VIDEO.videoWidth  || 480;
  const h = VIDEO.videoHeight || 360;
  CANVAS.width  = w;
  CANVAS.height = h;
  // Cập nhật biến CSS --ar (không set trực tiếp aspect-ratio) để cả 2 chế độ
  // bình thường lẫn toàn màn hình đều tự tính đúng theo tỉ lệ camera thật,
  // tránh bị trình duyệt kéo giãn méo hình khi vào fullscreen.
  STAGE.style.setProperty('--ar', `${w} / ${h}`);
}

/* ================== VÒNG LẶP ================== */
function loop() {
  if (handLandmarker && VIDEO.readyState >= 2) {
    fpsCounter++;
    const now = performance.now();
    if (now - lastFpsTime > 1000) {
      currentFps = fpsCounter;
      fpsCounter = 0;
      lastFpsTime = now;
    }

    if (VIDEO.currentTime !== lastVideoTime) {
      lastVideoTime = VIDEO.currentTime;
      try {
        const result = handLandmarker.detectForVideo(VIDEO, now);
        render(result);
      } catch (e) {
        console.warn(e);
      }
    }
  }
  requestAnimationFrame(loop);
}

/* ================== LÀM MƯỢT ================== */
function smooth(rawHands) {
  const out = [];
  for (let i = 0; i < rawHands.length; i++) {
    const raw = rawHands[i];
    if (!smoothedHands[i]) {
      smoothedHands[i] = raw.map(p => ({ x: p.x, y: p.y, z: p.z }));
    }
    const s = smoothedHands[i];
    for (let j = 0; j < raw.length; j++) {
      s[j].x += (raw[j].x - s[j].x) * SMOOTHING;
      s[j].y += (raw[j].y - s[j].y) * SMOOTHING;
      s[j].z += (raw[j].z - s[j].z) * SMOOTHING;
    }
    out.push(s);
  }
  smoothedHands.length = rawHands.length;
  return out;
}

/* ================== ĐẾM NGÓN TAY ================== */
function countFingers(landmarks) {
    let count = 0;
    for (let i = 1; i < 5; i++) {
        if (landmarks[TIP_IDX[i]].y < landmarks[PIP_IDX[i]].y) count++;
    }
    const thumbTip = landmarks[4];
    const thumbIP  = landmarks[3];
    const wrist    = landmarks[0];
    const distTip = Math.hypot(thumbTip.x - wrist.x, thumbTip.y - wrist.y);
    const distIP  = Math.hypot(thumbIP.x - wrist.x, thumbIP.y - wrist.y);
    if (distTip > distIP * 1.15) count++;
    return count;
}

/* ================== VẼ ================== */
function render(result) {
  const W = CANVAS.width;
  const H = CANVAS.height;

  CTX.setTransform(1, 0, 0, 1, 0, 0);
  CTX.clearRect(0, 0, W, H);

  const hasHand = result && result.landmarks && result.landmarks.length > 0;

  if (!hasHand) {
    FINGER_INFO.textContent = '✋ Số ngón: -';
    smoothedHands = [];
    return;
  }

  const hands = smooth(result.landmarks);

  let totalFingers = 0;
  for (const lm of hands) totalFingers += countFingers(lm);
  totalFingers = Math.min(totalFingers, 5);
  FINGER_INFO.textContent = `✋ Số ngón: ${totalFingers}  •  ${currentFps} FPS`;

  CTX.save();
  CTX.translate(W, 0);
  CTX.scale(-1, 1);

  hands.forEach((lm, i) => {
    const P = lm.map(p => ({ x: p.x * W, y: p.y * H }));
    drawRealisticHand(P, i === 0 ? 190 : 280, W, H);
  });

  CTX.restore();
}

/* ================== VẼ BÀN TAY CHÂN THỰC (ĐÃ THU NHỎ) ================== */
function drawRealisticHand(P, hue, W, H) {
  // Ước lượng kích thước bàn tay
  const handScale = Math.hypot(P[0].x - P[9].x, P[0].y - P[9].y);
  
  // ✅ GIẢM TỪ 0.28 XUỐNG 0.18 ĐỂ BÀN TAY NHỎ VÀ THANH MẢNH HƠN
  const baseW = Math.max(6, handScale * 0.18);

  CTX.lineCap  = "round";
  CTX.lineJoin = "round";

  /* ---------- 1. LÒNG BÀN TAY ---------- */
  const palm = PALM_IDX.map(i => P[i]);
  CTX.beginPath();
  CTX.moveTo(palm[0].x, palm[0].y);
  for (let i = 1; i < palm.length; i++) {
    CTX.lineTo(palm[i].x, palm[i].y);
  }
  CTX.quadraticCurveTo(
    (palm[0].x + P[1].x) / 2, (palm[0].y + P[1].y) / 2,
    palm[0].x, palm[0].y
  );
  CTX.closePath();

  const cx = (P[0].x + P[9].x) / 2;
  const cy = (P[0].y + P[9].y) / 2;
  const palmGrad = CTX.createRadialGradient(cx, cy, 0, cx, cy, handScale * 0.8);
  palmGrad.addColorStop(0, `hsla(${hue}, 95%, 65%, 0.4)`);
  palmGrad.addColorStop(0.6, `hsla(${hue}, 90%, 55%, 0.22)`);
  palmGrad.addColorStop(1, `hsla(${hue + 40}, 85%, 45%, 0.06)`);
  CTX.fillStyle = palmGrad;
  CTX.fill();

  CTX.strokeStyle = `hsla(${hue}, 100%, 75%, 0.65)`;
  CTX.lineWidth = 1.5;
  CTX.stroke();

  /* ---------- 2. CÁC ĐỐT XƯƠNG ---------- */
  for (const [a, b, w] of BONES) {
    const p1 = P[a];
    const p2 = P[b];
    const lineW = baseW * w;

    // Viền ngoài
    CTX.strokeStyle = `hsla(${hue}, 100%, 75%, 0.85)`;
    CTX.lineWidth = lineW;
    CTX.beginPath();
    CTX.moveTo(p1.x, p1.y);
    CTX.lineTo(p2.x, p2.y);
    CTX.stroke();

    // Highlight trắng bên trong
    CTX.strokeStyle = `hsla(${hue}, 100%, 95%, 0.55)`;
    CTX.lineWidth = lineW * 0.35;
    CTX.beginPath();
    CTX.moveTo(p1.x, p1.y);
    CTX.lineTo(p2.x, p2.y);
    CTX.stroke();
  }

  /* ---------- 3. CÁC KHỚP ---------- */
  for (let i = 0; i < P.length; i++) {
    const isTip = TIP_IDX.includes(i);
    const isPip = PIP_IDX.includes(i);
    
    if (isTip) {
      // Vòng sáng ngoài (móng tay)
      CTX.beginPath();
      CTX.arc(P[i].x, P[i].y, baseW * 0.28, 0, Math.PI * 2);
      CTX.fillStyle = `hsla(${hue}, 100%, 90%, 0.35)`;
      CTX.fill();

      // Điểm sáng trung tâm
      CTX.beginPath();
      CTX.arc(P[i].x, P[i].y, baseW * 0.16, 0, Math.PI * 2);
      CTX.fillStyle = `hsla(${hue}, 100%, 98%, 0.95)`;
      CTX.fill();
    } else if (isPip) {
      CTX.beginPath();
      CTX.arc(P[i].x, P[i].y, baseW * 0.18, 0, Math.PI * 2);
      CTX.fillStyle = `hsla(${hue}, 100%, 88%, 0.6)`;
      CTX.fill();
    } else if (i !== 0) {
      CTX.beginPath();
      CTX.arc(P[i].x, P[i].y, baseW * 0.12, 0, Math.PI * 2);
      CTX.fillStyle = `hsla(${hue}, 100%, 85%, 0.5)`;
      CTX.fill();
    }
  }

  /* ---------- 4. CỔ TAY ---------- */
  CTX.beginPath();
  CTX.arc(P[0].x, P[0].y, baseW * 0.45, 0, Math.PI * 2);
  CTX.fillStyle = `hsla(${hue}, 100%, 70%, 0.2)`;
  CTX.fill();
}

/* ================== NÚT ĐIỀU KHIỂN ================== */
BTN.addEventListener("click", () => {
  const hidden = STAGE.classList.toggle("no-video");
  BTN.classList.toggle("active", !hidden);
  BTN.textContent = hidden ? "Hiện video" : "Ẩn video";
});

BTN_FS.addEventListener("click", () => {
  if (!document.fullscreenElement) {
    STAGE.requestFullscreen().catch(err => console.error(err));
  } else {
    document.exitFullscreen();
  }
});

document.addEventListener("fullscreenchange", () => {
  BTN_FS.textContent = document.fullscreenElement ? "Thoát" : "Toàn màn hình";
  setTimeout(resizeCanvas, 100);
});

/* ================== BẮT ĐẦU ================== */
init();
</script>
</body>
</html>
